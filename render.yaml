# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: hospital-bulk-processor
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: HOSPITAL_API_BASE_URL
        value: https://hospital-directory.onrender.com
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_CONCURRENCY
        value: "20"
